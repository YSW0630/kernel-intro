# Disk type: "HDD" or "SSD"
TYPE=HDD
# Name of the device containing the filesystem to benchmark. For an HDD, it might be sdb or sdc; for an NVMe SSD, it might be nvme0n1.
DEVICE_NAME=sda
# If the filesystem is on a partition of the device above, specify the partition name. Leave this empty when the filesystem is directly on the device.
PART_NAME=sda1
# Directory where benchmark data is stored. It must be on the filesystem on "DEVICE_NAME" or "PART_NAME".
DATA_DIR=./mnt-hdd
